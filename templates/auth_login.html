{% load i18n %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% trans "Anmelden" %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">{% trans "Anmelden" %}</h1>

    {% if form.errors %}
      <div class="mb-4 p-3 rounded bg-red-100 text-red-800">
        {% trans "Bitte Benutzername und Passwort prüfen." %}
      </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="block text-sm font-medium mb-1">{% trans "Benutzername" %}</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">{% trans "Passwort" %}</label>
        {{ form.password }}
      </div>
      <button class="w-full px-4 py-2 bg-blue-600 text-white rounded">
        {% trans "Einloggen" %}
      </button>
    </form>

    <p class="mt-4 text-sm">
      {% trans "Kein Konto?" %} <a class="underline" href="/register/">{% trans "Registrieren" %}</a>
    </p>
  </div>
</body>
</html>
